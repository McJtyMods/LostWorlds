buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.4'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def sharedTools = [findProperty('gradletools_path')?.with { file(it) },
                   rootProject != project ? rootProject.file('gradletools.gradle') : null,
                   file('../Multi_neo/gradletools.gradle'),
                   file('../gradletools.gradle'),
                   file('gradletools.gradle')].find { it?.isFile() }
if (sharedTools != null) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/LostCities/1.21.11_neo/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "lostworlds"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
at()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    if (findProject(':LostCities') != null || providers.gradleProperty('lostcities_version').isPresent()) {
        lostcities()
    } else {
        implementation "maven.modrinth:the-lost-cities:1.21.11-9.5.6"
    }
}

modpublisher([], ['the-lost-cities'], [], ['the-lost-cities'], [])

repositories {
    maven {
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup 'maven.modrinth' }
    }
}
